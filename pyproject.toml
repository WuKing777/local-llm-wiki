[project]
name = "local-llm-wiki"
version = "0.1.0"
description = "Local personal LLM wiki tooling."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Local LLM Wiki contributors" },
]
requires-python = ">=3.11"
dependencies = [
    "pypdf>=4",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.scripts]
kb = "kb.cli:main"

[tool.setuptools.packages.find]
include = ["kb*"]

[project.urls]
Homepage = "https://github.com/WuKing777/local-llm-wiki"
Repository = "https://github.com/WuKing777/local-llm-wiki"
Issues = "https://github.com/WuKing777/local-llm-wiki/issues"
